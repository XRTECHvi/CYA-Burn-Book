'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>crypto.randomUUID(), now=()=>new Date().toISOString(), date=v=>v?new Date(v).toLocaleString():'Not specified', localDate=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}, enc=new TextEncoder(), dec=new TextDecoder();
const categories=['General workplace incident','Harassment','Retaliation','Discrimination','Safety','Payroll / overtime','Disciplinary action','Management instruction','Witness statement','Other'];
let db,key,salt,state=null,tab='Home',draft=null,dirty=false,recording=null,stream=null,chunks=[],recordStart=0,recordTimer,autoTimer,saveChain=Promise.resolve(),statusTimer,urls=[],busy=false;
const notify=(msg,err=false)=>{let s=$('status');s.textContent=msg;s.className='status show '+(err?'error':'success');clearTimeout(statusTimer);statusTimer=setTimeout(()=>s.className='status',6000)};
function b64(a){let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('cya-burn-book-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function getVault(){return new Promise((res,rej)=>{let r=db.transaction('vault').objectStore('vault').get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function putVault(v){return new Promise((res,rej)=>{let t=db.transaction('vault','readwrite');t.objectStore('vault').put(v,'main');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function derive(pass,s){let k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function seal(data,k,s){let iv=crypto.getRandomValues(new Uint8Array(12)),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(data)));return{format:'cya-vault-v1',salt:b64(s),iv:b64(iv),cipher:b64(new Uint8Array(cipher))}}async function unseal(v,k){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.cipher))))}
function persist(next){let k=key,s=salt;let task=saveChain.catch(()=>{}).then(async()=>{await putVault(await seal(next,k,s));state=next});saveChain=task;return task}function validVault(v){return v&&v.format==='cya-vault-v1'&&typeof v.salt==='string'&&typeof v.iv==='string'&&typeof v.cipher==='string'&&unb64(v.salt).length===16&&unb64(v.iv).length===12}function validState(s){return s&&Array.isArray(s.entries)&&Array.isArray(s.media)&&s.entries.every(e=>e&&typeof e.id==='string'&&typeof e.title==='string'&&Array.isArray(e.attachments))&&s.media.every(m=>m&&typeof m.id==='string'&&typeof m.data==='string'&&typeof m.name==='string')}
async function gate(){let v=await getVault();$('app').classList.add('hide');$('nav').classList.add('hide');$('gate').classList.remove('hide');$('gate').innerHTML=`<div class="lockscreen"><div class="logo">◈</div><div class="eyebrow">LOCAL VAULT</div><h1>CYA Burn Book</h1><p class="muted">Document. Protect. Defend.</p><div class="panel"><h2>${v?'Unlock your vault':'Create your private vault'}</h2><p class="muted">${v?'Enter your vault passphrase.':'Your records are encrypted on this device. Choose a strong passphrase of at least 12 characters.'}</p><form id="unlockForm"><label for="pass">Passphrase</label><input id="pass" type="password" autocomplete="${v?'current-password':'new-password'}" required ${v?'':'minlength="12"'}>${v?'':'<label for="confirm">Confirm passphrase</label><input id="confirm" type="password" autocomplete="new-password" required minlength="12">'}<button class="primary full" style="margin-top:16px">${v?'Unlock':'Create vault'}</button></form><p><small>No password reset. Keep encrypted backups. Clearing browser data can erase your vault.</small></p></div>${v?'':'<button id="restoreStart" class="full ghost">Restore encrypted backup</button>'}<p><small>Prototype · Not legal advice · No account or cloud sync</small></p></div>`;$('unlockForm').onsubmit=async e=>{e.preventDefault();if(busy)return;let pass=$('pass').value;if(!v&&pass!==$('confirm').value)return notify('Passphrases do not match.',true);busy=true;let btn=e.target.querySelector('button');btn.disabled=true;try{let s=v?unb64(v.salt):crypto.getRandomValues(new Uint8Array(16)),k=await derive(pass,s),data=v?await unseal(v,k):{entries:[],media:[]};if(!validState(data))throw Error('Invalid vault');key=k;salt=s;state=data;if(!v)await persist(data);start()}catch(err){key=null;state=null;notify(v?'Could not unlock. Check your passphrase.':'Could not create vault. Check browser storage.',true)}finally{busy=false;btn.disabled=false}};if($('restoreStart'))$('restoreStart').onclick=()=>restore(true)}
function start(){$('gate').classList.add('hide');$('gate').innerHTML='';$('app').classList.remove('hide');$('nav').classList.remove('hide');tab='Home';render();touch()}
function touch(){if(!state)return;clearTimeout(autoTimer);autoTimer=setTimeout(()=>{if(recording&&recording.state!=='inactive'||busy){touch();return}lockVault(true)},5*60*1000)}document.addEventListener('pointerdown',touch);document.addEventListener('keydown',touch);
async function lockVault(auto=false){if(busy)return notify('Finish the current operation first.',true);if(recording&&recording.state!=='inactive')return notify('Stop and save your recording before locking.',true);if(dirty&&!auto&&!confirm('Discard unsaved incident changes and lock?'))return;if(dirty&&auto){try{readDraft();if(!draft.title.trim())draft.title='Untitled draft';if(!draft.occurred)draft.occurred=localDate();await persist({...state,entries:[...state.entries.filter(x=>x.id!==draft.id),{...draft,modified:now()}]});dirty=false}catch{notify('Autosave failed; unsaved changes discarded for privacy.',true)}}try{await saveChain}catch{}clearTimeout(autoTimer);state=null;key=null;salt=null;draft=null;dirty=false;clearURLs();$('view').innerHTML='';$('report').innerHTML='';await gate()}
$('lock').onclick=()=>lockVault();function clearURLs(){urls.forEach(URL.revokeObjectURL);urls=[]}function fileURL(m){let u=URL.createObjectURL(new Blob([unb64(m.data)],{type:m.type||'application/octet-stream'}));urls.push(u);return u}function go(t){if(busy)return notify('Finish the current operation first.',true);if(recording&&recording.state!=='inactive')return notify('Stop recording before leaving this screen.',true);if(dirty&&!confirm('Discard unsaved changes?'))return;draft=null;dirty=false;tab=t;render();window.scrollTo(0,0)}
function render(){if(!state)return;clearURLs();$('nav').innerHTML=[['Home','⌂'],['Incidents','▤'],['Voice','●'],['Evidence','▣'],['Settings','⚙']].map(([t,i])=>`<button class="${tab===t?'active':''}" data-tab="${t}"><span aria-hidden="true">${i}</span>${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.tab));({Home:home,Incidents:incidents,Voice:voice,Evidence:evidence,Settings:settings,Editor:editor,AI:ai,Timeline:timeline,Reports:reports}[tab]||home)()}
function tile(title,icon,desc,id){return `<button class="tile" data-go="${id}"><span aria-hidden="true">${icon}</span><b>${title}</b><small>${desc}</small></button>`}function bindTiles(){$('view').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>b.dataset.go==='New'?newEntry():go(b.dataset.go))}
function home(){$('view').innerHTML=`<div class="panel"><div class="row spread"><div><div class="eyebrow">YOUR RECORDS</div><div class="stat">${state.entries.length}</div><small>Saved incidents</small></div><div><div class="stat">${state.media.length}</div><small>Evidence files</small></div></div><p class="muted">Encrypted local vault · No cloud sync</p></div><button class="record full" data-go="Voice">● &nbsp; Quick voice note</button><div class="sectionhead"><h2>Document & protect</h2></div><div class="grid">${tile('New incident','＋','Create a timestamped record','New')}${tile('Incident history','▤','Search saved incidents','Incidents')}${tile('Evidence vault','▣','Photos, files and audio','Evidence')}${tile('AI assistant','✦','Prepare a ChatGPT prompt','AI')}${tile('Timeline','◷','Review events in order','Timeline')}${tile('Export reports','⇩','Print or save a report','Reports')}</div><div class="notice">Keep a regular encrypted backup. This prototype is not a substitute for an independently secured evidence archive.</div>`;bindTiles()}
function entryHTML(e){return `<button class="entry" data-entry="${esc(e.id)}"><div class="row spread"><b>${esc(e.title||'Untitled incident')}</b><span class="tag">${esc(e.category)}</span></div><p>${esc(date(e.occurred))} · ${esc(e.location||'No location')} · ${e.attachments.length} attachment(s)</p><p>${esc((e.notes||'').slice(0,100))}</p></button>`}function bindEntries(){document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>openEntry(b.dataset.entry))}function incidents(){$('view').innerHTML=`<div class="row spread"><h2>Incident history</h2><button id="add" class="primary">+ New</button></div><input id="search" type="search" placeholder="Search title, notes, people…" aria-label="Search incidents"><label for="filter">Category</label><select id="filter"><option value="">All categories</option>${categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><div id="entries"></div>`;$('add').onclick=()=>newEntry();let show=()=>{let q=$('search').value.toLowerCase(),f=$('filter').value;let a=state.entries.filter(e=>(!f||e.category===f)&&[e.title,e.notes,e.people,e.witnesses,e.location].join(' ').toLowerCase().includes(q)).sort((a,b)=>new Date(b.occurred)-new Date(a.occurred));$('entries').innerHTML=a.map(entryHTML).join('')||'<div class="panel muted">No matching incidents.</div>';bindEntries()};$('search').oninput=show;$('filter').onchange=show;show()}
function newEntry(mediaId){draft={id:uid(),title:'',category:mediaId?'Witness statement':categories[0],occurred:localDate(),location:'',people:'',witnesses:'',notes:'',followup:'',attachments:mediaId?[mediaId]:[],created:now(),modified:now()};dirty=true;tab='Editor';render();window.scrollTo(0,0)}function openEntry(id){if(dirty&&!confirm('Discard unsaved changes?'))return;let e=state.entries.find(x=>x.id===id);if(!e)return;draft=structuredClone(e);dirty=false;tab='Editor';render();window.scrollTo(0,0)}
function editor(){let e=draft;if(!e)return go('Incidents');let exists=state.entries.some(x=>x.id===e.id);$('view').innerHTML=`<div id="editor"><h2>${exists?'Edit incident':'New incident'}</h2><form id="incidentForm"><label for="title">Title *</label><input id="title" required maxlength="180" value="${esc(e.title)}" placeholder="e.g. Overtime instruction"><label for="category">Category</label><select id="category">${categories.map(c=>`<option ${e.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label for="occurred">Date & time of incident *</label><input id="occurred" type="datetime-local" required value="${esc(e.occurred)}"><label for="location">Location</label><input id="location" value="${esc(e.location)}"><label for="people">People involved</label><input id="people" value="${esc(e.people)}"><label for="witnesses">Witnesses</label><input id="witnesses" value="${esc(e.witnesses)}"><label for="notes">What happened? (facts and exact quotes)</label><textarea id="notes" rows="6" placeholder="Describe what you personally saw, heard or did.">${esc(e.notes)}</textarea><label for="followup">Follow-up / outcome</label><textarea id="followup">${esc(e.followup)}</textarea><div class="panel"><h3>Evidence references</h3><p><small>Attach files already in your encrypted evidence vault.</small></p><div id="attached">${state.media.map(m=>`<label class="row"><input type="checkbox" data-mid="${esc(m.id)}" ${e.attachments.includes(m.id)?'checked':''} style="width:20px;min-height:20px">${esc(m.name)}</label>`).join('')||'<small>No evidence yet. Save this incident, then add files in Evidence.</small>'}</div></div><p><small>Created: ${esc(date(e.created))}<br>Last saved: ${exists?esc(date(e.modified)):'Not yet saved'}</small></p><button class="primary full" id="saveIncident">Save incident</button></form><div class="row" style="margin-top:10px"><button id="cancel">Cancel</button>${exists?'<button id="reportOne">Report</button><button id="aiOne">ChatGPT prompt</button><button id="deleteIncident" class="danger">Delete</button>':''}</div></div>`;let form=$('incidentForm');form.oninput=()=>{readDraft();dirty=true};form.onchange=form.oninput;form.onsubmit=async ev=>{ev.preventDefault();try{await saveDraft(true)}catch{}};$('cancel').onclick=()=>go('Incidents');if(exists){$('deleteIncident').onclick=async()=>{if(busy||!confirm('Delete this incident? Its evidence files will remain in the vault.'))return;busy=true;try{await persist({...state,entries:state.entries.filter(x=>x.id!==e.id)});dirty=false;busy=false;go('Incidents');notify('Incident deleted.')}catch{notify('Could not delete incident.',true)}finally{busy=false}};$('reportOne').onclick=()=>{if(dirty)return notify('Save your changes first.',true);printReport([e])};$('aiOne').onclick=()=>{if(dirty)return notify('Save your changes first.',true);go('AI');$('aiEntry').value=e.id;buildPrompt()}}}
function readDraft(){if(!$('incidentForm'))return;for(let k of ['title','category','occurred','location','people','witnesses','notes','followup'])draft[k]=$(k).value;draft.attachments=[...document.querySelectorAll('[data-mid]:checked')].map(c=>c.dataset.mid)}async function saveDraft(interactive){if(busy)return;readDraft();if(!draft.title.trim()||!draft.occurred){if(interactive)notify('Enter a title and date.',true);else throw Error('Incomplete draft');return}busy=true;let d={...draft,title:draft.title.trim(),modified:now()};try{await persist({...state,entries:[...state.entries.filter(x=>x.id!==d.id),d]});draft=d;dirty=false;if(interactive){tab='Incidents';draft=null;render();notify('Incident saved.')}}catch(e){notify('Save failed. Storage may be full; keep this screen open.',true);throw e}finally{busy=false}}
async function sha(data){return [...new Uint8Array(await crypto.subtle.digest('SHA-256',data))].map(v=>v.toString(16).padStart(2,'0')).join('')}async function mediaFrom(blob,name){let a=new Uint8Array(await blob.arrayBuffer());return{id:uid(),name,type:blob.type||'application/octet-stream',size:a.length,created:now(),sha256:await sha(a),data:b64(a)}}function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}function downloadMedia(m){download(new Blob([unb64(m.data)],{type:m.type}),m.name)}
function mediaHTML(m){let audio=m.type.startsWith('audio/')||m.type.startsWith('video/');let preview=m.type.startsWith('image/')?`<img src="${fileURL(m)}" alt="Evidence preview">`:audio?`<audio controls preload="none" src="${fileURL(m)}"></audio>`:'';return `<div class="file"><b>${esc(m.name)}</b><p><small>${esc(date(m.created))} · ${(m.size/1024).toFixed(1)} KB · ${state.entries.filter(e=>e.attachments.includes(m.id)).length} linked incident(s)</small></p>${preview}<details><summary><small>Original file SHA-256</small></summary><small style="overflow-wrap:anywhere">${esc(m.sha256)}</small></details><div class="row" style="margin-top:8px"><button data-dl="${esc(m.id)}">Export</button><button data-link="${esc(m.id)}">New incident</button><button data-remove="${esc(m.id)}" class="ghost">Delete</button></div></div>`}function bindMedia(){$('view').querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>downloadMedia(state.media.find(m=>m.id===b.dataset.dl)));$('view').querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>newEntry(b.dataset.link));$('view').querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(busy)return;let id=b.dataset.remove;if(!confirm('Delete this original file and remove its links from incidents?'))return;busy=true;try{await persist({...state,media:state.media.filter(m=>m.id!==id),entries:state.entries.map(e=>({...e,attachments:e.attachments.filter(x=>x!==id)}))});render();notify('Evidence deleted.')}catch{notify('Delete failed.',true)}finally{busy=false}})}
function evidence(){$('view').innerHTML=`<h2>Evidence vault</h2><div class="panel"><label for="files">Add original files (max 15 MB each)</label><input id="files" type="file" multiple><p><small>Files stay in this encrypted vault. Avoid patient information and other records you are not authorized to retain.</small></p></div><div class="panel">${state.media.slice().reverse().map(mediaHTML).join('')||'<p class="muted">No evidence saved.</p>'}</div>`;$('files').onchange=async e=>{if(busy)return;busy=true;try{let files=[...e.target.files];if(files.some(f=>f.size>15*1024*1024))throw Error('One or more files exceed 15 MB.');let a=[];for(let f of files)a.push(await mediaFrom(f,f.name));await persist({...state,media:[...state.media,...a]});render();notify(`${a.length} file(s) saved.`)}catch(err){notify(err.message||'Could not save files.',true)}finally{busy=false}};bindMedia()}
function voice(){$('view').innerHTML=`<h2>Voice notes</h2><div class="notice">Record your own recollection. Only record other people when lawful and with required consent. Do not record patient information. Keep this screen open; background recording is not supported.</div><div class="panel"><div id="timer" class="timer">00:00</div><button id="rec" class="record full">● Start recording</button><p id="recHint" class="muted"><small>Microphone access requires HTTPS or localhost. Maximum recording: 5 minutes.</small></p></div><div class="panel"><h3>Transcribe with ChatGPT</h3><p class="muted">Export a recording below, then open ChatGPT and attach it if audio uploads are supported on your account. Ask for a verbatim transcript. Paste the result into an incident.</p><button id="transcribe">Copy transcription prompt</button> <a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT</a></div><div class="panel">${state.media.filter(m=>m.type.startsWith('audio/')||m.type.startsWith('video/')).slice().reverse().map(mediaHTML).join('')||'<p class="muted">No voice recordings yet.</p>'}</div>`;$('rec').onclick=toggleRecord;$('transcribe').onclick=()=>copy('Transcribe the attached audio verbatim. Mark uncertain words [unclear], identify speakers only if known, and do not invent details. Then provide a separate factual summary.');bindMedia()}
async function toggleRecord(){if(busy)return;if(recording&&recording.state!=='inactive'){recording.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return notify('Recording needs a supported browser on HTTPS or localhost.',true);busy=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];let type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recording=new MediaRecorder(stream,type?{mimeType:type}:undefined);recording.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recording.onerror=()=>notify('Recording error. Stop and try again.',true);recording.onstop=async()=>{busy=true;clearInterval(recordTimer);stream?.getTracks().forEach(t=>t.stop());try{let t=recording.mimeType||chunks[0]?.type||'audio/webm',blob=new Blob(chunks,{type:t}),ext=t.includes('mp4')?'m4a':t.includes('ogg')?'ogg':'webm';if(!blob.size)throw Error('Empty recording.');if(blob.size>15*1024*1024)throw Error('Recording exceeds 15 MB.');let m=await mediaFrom(blob,'Voice-'+new Date(recordStart).toISOString().replace(/[:.]/g,'-')+'.'+ext);await persist({...state,media:[...state.media,m]});notify('Original recording saved.')}catch(err){notify('Recording not saved: '+err.message,true);let t=recording.mimeType||chunks[0]?.type||'audio/webm';let blob=new Blob(chunks,{type:t});if(blob.size)download(blob,'unsaved-voice.'+(t.includes('mp4')?'m4a':'webm'))}finally{recording=null;stream=null;chunks=[];busy=false;render();touch()}};recordStart=Date.now();recording.start(1000);$('rec').textContent='■ Stop & save';recordTimer=setInterval(()=>{let s=Math.floor((Date.now()-recordStart)/1000);if($('timer'))$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s>=300&&recording?.state==='recording')recording.stop()},250)}catch(err){stream?.getTracks().forEach(t=>t.stop());recording=null;notify('Microphone unavailable or permission denied.',true)}finally{busy=false}}
async function copy(t){try{await navigator.clipboard.writeText(t);notify('Copied. Paste into ChatGPT.')}catch{let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();let ok=document.execCommand('copy');a.remove();notify(ok?'Copied.':'Copy unavailable; select the prompt manually.',!ok)}}
function ai(){$('view').innerHTML=`<h2>ChatGPT assistant</h2><div class="notice">Nothing is sent automatically. Review and redact names, patient information, and sensitive details before copying. ChatGPT is a separate online service, not part of the local vault.</div><label for="aiEntry">Select a saved incident</label><select id="aiEntry"><option value="">Generic incident template</option>${state.entries.map(e=>`<option value="${esc(e.id)}">${esc(e.title)}</option>`).join('')}</select><label class="row"><input type="checkbox" id="includePeople" style="width:20px;min-height:20px">Include people, witnesses and location</label><label for="aiPrompt">Review / edit prompt</label><textarea id="aiPrompt" rows="12"></textarea><div class="row"><button class="primary" id="copyPrompt">Copy prompt</button><a href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Open ChatGPT ↗</a></div><p class="muted">Paste the response into your incident after reviewing it for accuracy. No paid API required.</p>`;$('aiEntry').onchange=buildPrompt;$('includePeople').onchange=buildPrompt;$('copyPrompt').onclick=()=>copy($('aiPrompt').value);buildPrompt()}function buildPrompt(){let e=state.entries.find(e=>e.id===$('aiEntry').value),p='Help me organize a workplace incident into a factual, professional first-person statement. Preserve exact quotes as quotes, distinguish observations from assumptions, flag missing facts, and do not invent dates, witnesses, or conclusions. Provide a separate follow-up checklist. Do not provide definitive legal conclusions.\n\n';if(e){p+=`Title: ${e.title}\nCategory: ${e.category}\nIncident time: ${date(e.occurred)}\n`;if($('includePeople').checked)p+=`Location: ${e.location}\nPeople: ${e.people}\nWitnesses: ${e.witnesses}\n`;p+=`Notes: ${e.notes}\nFollow-up: ${e.followup}`}else p+='[Paste redacted notes here]';$('aiPrompt').value=p}
function timeline(){$('view').innerHTML=`<h2>Incident timeline</h2><p class="muted">Oldest to newest by reported incident time.</p>${state.entries.slice().sort((a,b)=>new Date(a.occurred)-new Date(b.occurred)).map(entryHTML).join('')||'<div class="panel muted">No saved incidents.</div>'}`;bindEntries()}function reports(){$('view').innerHTML=`<h2>Export reports</h2><p class="muted">Select incidents to print or save as PDF using your device's print dialog. Reports list attachment names and hashes; original files are exported separately.</p><div class="panel">${state.entries.map(e=>`<label class="row"><input type="checkbox" data-report="${esc(e.id)}" checked style="width:20px;min-height:20px">${esc(e.title)}</label>`).join('')||'<small>No incidents to export.</small>'}</div><button class="primary full" id="print">Print / save selected report</button>`;$('print').onclick=()=>{let ids=[...document.querySelectorAll('[data-report]:checked')].map(b=>b.dataset.report);if(!ids.length)return notify('Select at least one incident.',true);printReport(state.entries.filter(e=>ids.includes(e.id)))}}
function printReport(entries){$('report').innerHTML=`<h1>CYA Burn Book — Incident Report</h1><p>Exported ${esc(date(now()))} · ${entries.length} incident(s)</p><p>Personal documentation. Reported facts have not been independently verified.</p>${entries.map(e=>`<article><h2>${esc(e.title)}</h2><p>Category: ${esc(e.category)}\nIncident time: ${esc(date(e.occurred))}\nCreated: ${esc(date(e.created))}\nLast modified: ${esc(date(e.modified))}\nLocation: ${esc(e.location)}\nPeople: ${esc(e.people)}\nWitnesses: ${esc(e.witnesses)}</p><h3>Incident notes</h3><p>${esc(e.notes)}</p><h3>Follow-up</h3><p>${esc(e.followup)}</p><h3>Evidence references</h3>${e.attachments.map(id=>state.media.find(m=>m.id===id)).filter(Boolean).map(m=>`<p>${esc(m.name)}\nSHA-256: ${esc(m.sha256)}</p>`).join('')||'<p>None</p>'}</article>`).join('')}`;window.print()}window.addEventListener('afterprint',()=>$('report').innerHTML='');
function settings(){$('view').innerHTML=`<h2>Privacy & settings</h2><div class="panel"><h3>Encrypted backups</h3><p>Export the complete encrypted vault. You need the original passphrase to restore it.</p><button id="backup" class="primary full">Export encrypted backup</button><button id="restore" class="full ghost" style="margin-top:8px">Restore backup (replaces vault)</button></div><div class="panel"><h3>Device storage</h3><p id="storageInfo" class="muted">Checking available storage…</p><button id="persistStorage">Request persistent storage</button><p><small>Browser data can still be removed. Keep backups outside this app.</small></p></div><div class="panel"><h3>Security</h3><p class="muted">AES-256-GCM encryption, passphrase-derived key (PBKDF2-SHA-256, 600,000 iterations), 5-minute inactivity lock. No native Face ID or security audit yet.</p><p><small>Auto-lock waits for an active recording or operation. This prototype has no immutable audit log, trusted timestamp or recovery service.</small></p><button id="lock2">Lock now</button></div><div class="panel"><h3>Install on iPhone</h3><p class="muted">Open the hosted app in Safari, use Share → Add to Home Screen. Launch once online so the offline app shell can be cached.</p><small>Version 1.0 prototype · Independent workplace recordkeeping tool.</small></div>`;$('backup').onclick=async()=>{try{await saveChain;download(new Blob([JSON.stringify(await getVault())],{type:'application/json'}),'CYA-encrypted-backup-'+new Date().toISOString().slice(0,10)+'.cya.json');notify('Encrypted backup prepared.')}catch{notify('Backup failed.',true)}};$('restore').onclick=()=>restore(false);$('lock2').onclick=()=>lockVault();navigator.storage?.estimate().then(x=>{if($('storageInfo'))$('storageInfo').textContent=`Browser reports ${(x.usage/1048576).toFixed(1)} MB used; quota about ${(x.quota/1048576).toFixed(0)} MB.`}).catch(()=>{});$('persistStorage').onclick=async()=>{try{let yes=await navigator.storage?.persist();notify(yes?'Browser granted persistent storage.':'Persistent storage not granted; use backups.',!yes)}catch{notify('Not supported by this browser.',true)}}}
function restore(isNew){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{let f=input.files[0];if(!f)return;let pass=prompt('Enter the backup vault passphrase:');if(pass===null)return;if(!isNew&&!confirm('Replace the current vault? Export a backup first if needed.'))return;busy=true;try{let v=JSON.parse(await f.text());if(!validVault(v))throw Error('Invalid backup');let s=unb64(v.salt),k=await derive(pass,s),data=await unseal(v,k);if(!validState(data))throw Error('Invalid contents');await saveChain.catch(()=>{});await putVault(v);key=k;salt=s;state=data;draft=null;dirty=false;start();notify('Backup restored.')}catch(e){notify('Restore failed. Check backup and passphrase.',true)}finally{busy=false}};input.click()}
(async()=>{try{if(!crypto.subtle||!window.indexedDB)throw Error('Secure browser storage unavailable. Open via HTTPS or localhost.');db=await openDB();await gate();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){$('gate').innerHTML=`<div class="panel"><h2>Cannot open vault</h2><p>${esc(e.message)}</p><p>Use Safari or another modern browser over HTTPS or localhost.</p></div>`}})();
</script></body></html>
